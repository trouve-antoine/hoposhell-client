[package]
name = "hoposhell-client"
version = "0.4.6"
edition = "2021"

[[bin]]
name = "hopo"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.1"
portable-pty = "0.9.0"
openssl = { version = "0.10.82", features = ["vendored"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "charset", "http2", "json", "native-tls", "system-proxy"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rand = "0.10.3"
shellexpand = "3.1.2"
glob = "0.3.4"
tempfile = "3.27.0"
zstd = "0.14.4"
